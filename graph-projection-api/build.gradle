plugins {
    id 'buildlogic-gds-java'
}

description = 'Neo4j Graph Data Science :: Graph Projection API'

group = 'org.neo4j.gds'

dependencies {
    annotationProcessor project(':annotations')
    annotationProcessor openGds.recordBuilder

    compileOnly         openGds.jetbrains.annotations
    compileOnly         openGds.recordBuilder

    implementation(
            project(':annotations'),
            project(':string-formatting'),
    )

    api openGds.jackson.databind
    api openGds.jackson.dataformat.csv

    testImplementation platform(openGds.junit.bom)
    testImplementation openGds.bundles.test.basic
    testImplementation openGds.hamcrest

    testRuntimeOnly openGds.bundles.test.platforms
}
