plugins {
    id 'buildlogic-gds-java'
}

description = 'Neo4j Graph Data Science :: Algorithms Compute Facade'

group = 'org.neo4j.gds'

dependencies {

    api project(':core-api')
    api project(':core') // TODO: this is here because of the `GraphStoreCatalogService` --> refactor it so we can use the service without bringing the entire sub-project
    api project(':node-embeddings-params')

    implementation project(':algo') // TODO: extract the results and config-parameter converters to a separate module and depend on it
    implementation project(':algo-common') // TODO: extract the results to a separate module and depend on it
    implementation project(':algorithms-compute-facade')
    implementation project(":centrality-configs") //Need for pagerank/hits
    implementation project(':centrality-params')
    implementation project(':collections')
    implementation project(":community-configs") //Need for SLLPA
    implementation project(':community-params')
    implementation project(":config-api") //Need for Pregel
    implementation project(':path-finding-params')
    implementation project(":pregel")
    implementation project(':similarity-params')
    implementation project(':string-formatting')

    // Test dependencies
    testImplementation openGds.assertj.core
    testImplementation platform(openGds.junit.bom)
    testImplementation project(':test-utils')
}
